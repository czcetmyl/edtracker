<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;background:#f0f4f8;color:#222;}

#authScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a3a5c,#2d6a9f);}

<script>
const SB_URL='https://qpwkstxrugcqckuweopc.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwd2tzdHhydWdjcWNrdXdlb3BjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MDI0ODAsImV4cCI6MjA5MDA3ODQ4MH0.ehbp-oa9WzeTq_wSE9wSo8MLZ32WA_Y2ut5KRjDgVWE';
const AI_URL='https://api.groq.com/openai/v1/chat/completions';
const AI_KEY='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';
const sb=supabase.createClient(SB_URL,SB_KEY);

const PALETTE=['#1a3a5c','#0f6e56','#7c3aed','#b45309','#0369a1','#9f1239','#1d4ed8','#166534','#6d28d9','#92400e','#0e7490','#be185d'];
const col=i=>PALETTE[i%PALETTE.length];
const ini=n=>{const w=n.trim().split(/\s+/);return(w.length>=2?w[0][0]+w[1][0]:n.slice(0,2)).toUpperCase();};

const DEF={
  A1:{label:'A1 — Beginner',sub:'Beginner Level',skills:['Reading Skills','Pronunciation','Vocabulary','Listening Comprehension','Speaking Confidence','Letter & Word Recognition','Participation & Engagement'],students:[]},
  A2:{label:'A2 — Elementary',sub:'Elementary Level',skills:['Reading Skills','Pronunciation','Vocabulary Usage','Listening Comprehension','Speaking Fluency','Basic Writing','Grammar Awareness','Participation & Engagement'],students:[]},
  B1:{label:'B1 — Intermediate',sub:'Intermediate Level',skills:['Reading Comprehension','Pronunciation & Intonation','Vocabulary Range','Listening Comprehension','Speaking Fluency','Writing Ability','Grammar Accuracy','Self-Expression','Participation & Engagement'],students:[]},
  B2:{label:'B2 — Upper Intermediate',sub:'Upper Intermediate Level',skills:['Reading Comprehension','Pronunciation & Intonation','Vocabulary & Idioms','Listening Comprehension','Speaking Fluency','Writing Quality','Grammar Accuracy','Critical Thinking','Communication Strategy','Participation & Engagement'],students:[]},
  C1:{label:'C1 — Advanced',sub:'Advanced Level',skills:['Reading & Analysis','Pronunciation & Fluency','Advanced Vocabulary','Listening & Inference','Speaking Precision','Academic Writing','Grammar Mastery','Critical Thinking','Presentation Skills','Participation & Engagement'],students:[]},
  C2:{label:'C2 — Proficiency',sub:'Proficiency Level',skills:['Reading & Nuance','Pronunciation & Natural Speech','Idiomatic Vocabulary','Listening & Context','Speaking Sophistication','Advanced Writing','Grammar & Style','Analytical Thinking','Presentation & Debate','Overall Mastery'],students:[]}
};

const SCORES=[
  {min:75,max:75,rc:'r75',bc:'b75',en:'No knowledge yet'},
  {min:76,max:80,rc:'r76',bc:'b76',en:'Just starting to learn'},
  {min:81,max:85,rc:'r81',bc:'b81',en:'Familiar but needs practice'},
  {min:86,max:90,rc:'r86',bc:'b86',en:'Developing well'},
  {min:91,max:95,rc:'r91',bc:'b91',en:'Almost mastered'},
  {min:96,max:100,rc:'r96',bc:'b96',en:'Fully mastered / Excellent'},
];

let D={};
let user=null;
let WEEKS=Array.from({length:10},(_,i)=>`Week ${i+1}`);
let curSkLvl=null;
let saveT;

function initD(){
  D={};
  Object.keys(DEF).forEach(l=>D[l]={label:DEF[l].label,sub:DEF[l].sub,skills:[...DEF[l].skills],students:[]});
}

// ── AI ──
async function aiCall(prompt){
  try{
    const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+AI_KEY},
      body:JSON.stringify({model:'llama-3.1-8b-instant',messages:[{role:'user',content:prompt}],max_tokens:512,temperature:0.3})});
    const d=await r.json();
    return d.choices?.[0]?.message?.content?.trim()||'';
  }catch(e){return '';}
}

function showToast(msg,dur=2500){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),dur);}

async function fixGrammar(btn){
  const ta=btn.previousElementSibling;
  if(!ta?.value?.trim()){alert('Write something first!');return;}
  btn.disabled=true;btn.textContent='⏳...';
  const r=await aiCall(`Fix grammar, make it professional and clear. Return ONLY the corrected text:\n\n"${ta.value.trim()}"`);
  if(r){ta.value=r;qSave();showToast('✅ Grammar fixed!');}else showToast('⚠️ AI unavailable');
  btn.disabled=false;btn.textContent='✨ Fix Grammar';
}

async function fixNoteGrammar(btn,nid){
  const ta=document.querySelector(`[data-save="${nid}"]`);
  if(!ta?.value?.trim()){alert('Write notes first!');return;}
  btn.disabled=true;btn.textContent='⏳...';
  const r=await aiCall(`Fix grammar, make professional. Return ONLY corrected text:\n\n"${ta.value.trim()}"`);
  if(r){ta.value=r;qSave();showToast('✅ Grammar fixed!');}else showToast('⚠️ AI unavailable');
  btn.disabled=false;btn.textContent='✨ Fix Grammar';
}

// ── TRANSLATE ──
function closeTrMod(){document.getElementById('trMod').classList.remove('on');}
async function runTranslate(){
  const lang=document.getElementById('langSel').value;
  if(!lang){alert('Please select a language!');return;}
  const btn=document.getElementById('doTrBtn');
  btn.disabled=true;btn.textContent='⏳ Translating...';
  closeTrMod();
  showToast(`🌐 Translating to ${lang}...`,10000);
  const lvl=document.querySelector('.lsec.active')?.id?.replace('sec-','');

  // Score guide
  for(const s of SCORES){
    const r=await aiCall(`Translate to ${lang}. Return ONLY translated text: "${s.en}"`);
    if(r) document.querySelectorAll(`.legend-tr[data-k="${s.en}"]`).forEach(el=>{el.textContent=r;el.style.display='block';});
  }

  // Skills
  if(lvl){
    for(let i=0;i<D[lvl].skills.length;i++){
      const r=await aiCall(`Translate to ${lang}. Return ONLY translated text: "${D[lvl].skills[i]}"`);
      if(r) document.querySelectorAll(`.skill-tr[data-l="${lvl}"][data-i="${i}"]`).forEach(el=>{el.textContent=r;el.style.display='block';});
    }
  }

  // Teacher notes
  if(lvl){
    document.querySelectorAll(`#sec-${lvl} .tnotes-area`).forEach(async ta=>{
      if(!ta.value.trim())return;
      const r=await aiCall(`Fix grammar then translate to ${lang}. Return ONLY translated text:\n\n"${ta.value.trim()}"`);
      if(r){
        const nid=ta.dataset.save;
        let box=document.getElementById(`trb-${nid}`);
        if(!box){box=document.createElement('div');box.id=`trb-${nid}`;box.className='trbox';ta.after(box);}
        box.innerHTML=`<div class="trlang">🌐 ${lang}</div><div>${r}</div>`;
        box.classList.add('on');
      }
    });
  }

  showToast(`✅ Translated to ${lang}!`);
  btn.disabled=false;btn.textContent='🌐 Translate All';
}

// ── AUTH ──
async function doLogin(){
  const email=document.getElementById('em').value.trim();
  const pass=document.getElementById('pw').value;
  if(!email||!pass){setAmsg('Please fill in all fields.','error');return;}
  const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Logging in...';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  btn.disabled=false;btn.textContent='Login';
  if(error){setAmsg('❌ '+error.message,'error');return;}
  startApp(data.user);
}
function setAmsg(msg,type){document.getElementById('amsg').innerHTML=`<div class="auth-msg ${type}">${msg}</div>`;}
async function doLogout(){
  await sb.auth.signOut();user=null;
  document.getElementById('appScreen').style.display='none';
  document.getElementById('authScreen').style.display='flex';
  initD();
}
function startApp(u){
  user=u;
  document.getElementById('authScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  document.getElementById('tname').textContent='👩‍🏫 '+(u.user_metadata?.name||u.email);
  loadAll();
}

// ── DB ──
async function dbAll(){try{const {data}=await sb.from('tracker_data').select('id,value');return data||[];}catch(e){return[];}}
async function dbSet(id,val){
  try{await sb.from('tracker_data').upsert({id,user_id:user.id,value:val,updated_at:new Date().toISOString()},{onConflict:'id'});return true;}
  catch(e){return false;}
}

// ── SAVE / LOAD ──
function qSave(){clearTimeout(saveT);saveT=setTimeout(saveAll,800);}
function setSMsg(t,bg,c){const m=document.getElementById('smsg');m.textContent=t;m.style.background=bg;m.style.color=c;}

async function saveAll(){
  setSMsg('💾 Saving...','#fef3c7','#92400e');
  const fields={};document.querySelectorAll('[data-save]').forEach(el=>fields[el.dataset.save]=el.value);
  const students={};Object.keys(D).forEach(l=>students[l]=D[l].students);
  const skills={};Object.keys(D).forEach(l=>skills[l]=D[l].skills);
  const ok=await Promise.all([
    dbSet('__fields__',JSON.stringify(fields)),
    dbSet('__students__',JSON.stringify(students)),
    dbSet('__weeks__',JSON.stringify(WEEKS)),
    dbSet('__skills__',JSON.stringify(skills))
  ]);
  if(ok.every(Boolean)){setSMsg('✅ Saved!','rgba(255,255,255,0.15)','#cfe');setTimeout(()=>setSMsg('☁️ Cloud Save ON','rgba(255,255,255,0.15)','#fff'),1800);}
  else setSMsg('⚠️ Error saving','#fee2e2','#991b1b');
}

async function loadAll(){
  setSMsg('⏳ Loading...','rgba(255,255,255,0.15)','#fff');
  initD();
  const rows=await dbAll();

  const wr=rows.find(r=>r.id==='__weeks__');
  if(wr){try{WEEKS=JSON.parse(wr.value);}catch(e){}}

  const sr=rows.find(r=>r.id==='__skills__');
  if(sr){try{
    const sk=JSON.parse(sr.value);
    Object.keys(sk).forEach(l=>{
      if(!D[l])return;
      const arr=sk[l];
      if(Array.isArray(arr)){
        D[l].skills=arr.map(s=>{
          if(typeof s==='string'&&s.trim()&&s.trim()!=='undefined') return s.trim();
          if(s&&typeof s==='object'){
            const v=s.en||s.zh||s.ko||s.vi||Object.values(s).find(x=>x&&typeof x==='string'&&x!=='undefined');
            return v?String(v).trim():null;
          }
          return null;
        }).filter(Boolean);
      }
    });
  }catch(e){}}

  const lr=rows.find(r=>r.id==='__students__');
  if(lr){try{
    const ls=JSON.parse(lr.value);
    Object.keys(ls).forEach(l=>{if(D[l]&&Array.isArray(ls[l]))D[l].students=ls[l];});
  }catch(e){}}

  render();

  const fr=rows.find(r=>r.id==='__fields__');
  if(fr){try{
    const fd=JSON.parse(fr.value);
    Object.entries(fd).forEach(([k,v])=>{
      const el=document.querySelector(`[data-save="${k}"]`);
      if(el){el.value=v;if(el.classList.contains('sc'))styleScore(el);}
    });
  }catch(e){}}

  setSMsg('☁️ Cloud Save ON','rgba(255,255,255,0.15)','#fff');
}

// ── SCORE ──
function getRange(v){const n=parseInt(v);if(isNaN(n))return null;return SCORES.find(r=>n>=r.min&&n<=r.max)||null;}
function styleScore(inp){
  let v=parseInt(inp.value);
  if(!inp.value.trim()){inp.className='sc';const b=inp.nextElementSibling;if(b){b.textContent='';b.className='sbadge';}return;}
  if(v<75){inp.value=75;v=75;}if(v>100){inp.value=100;v=100;}
  const r=getRange(v);
  inp.className='sc '+(r?r.rc:'');
  const b=inp.nextElementSibling;
  if(b&&r){b.textContent=r.en;b.className=`sbadge ${r.bc}`;}
}
function onScore(inp){styleScore(inp);qSave();}

function mkScore(id){
  return`<div class="scwrap"><input class="sc" type="number" min="75" max="100" placeholder="—" data-save="${id}" oninput="onScore(this)"><span class="sbadge"></span></div>`;
}

// ── WEEKS ──
function editWeeks(){
  const v=prompt('Edit week labels (one per line):',WEEKS.join('\n'));
  if(!v)return;
  const nw=v.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!nw.length)return;
  WEEKS=nw;
  const al=document.querySelector('.lsec.active')?.id?.replace('sec-','');
  render();
  if(al)showLvl(al,document.querySelector('.tab.active'));
  restoreF();saveAll();
}
async function restoreF(){
  const rows=await dbAll();
  const fr=rows.find(r=>r.id==='__fields__');
  if(fr){try{const fd=JSON.parse(fr.value);Object.entries(fd).forEach(([k,v])=>{const el=document.querySelector(`[data-save="${k}"]`);if(el){el.value=v;if(el.classList.contains('sc'))styleScore(el);}});}catch(e){}}
}

// ── SKILL MODAL ──
function openChangePw(){
  document.getElementById('newPw1').value='';
  document.getElementById('newPw2').value='';
  document.getElementById('changePwMsg').style.display='none';
  document.getElementById('changePwMod').classList.add('on');
}
function closeChangePw(){document.getElementById('changePwMod').classList.remove('on');}
async function doChangePw(){
  const pw1=document.getElementById('newPw1').value;
  const pw2=document.getElementById('newPw2').value;
  const msg=document.getElementById('changePwMsg');
  const btn=document.getElementById('changePwBtn');
  if(!pw1||!pw2){showPwMsg('Please fill in both fields.','#fee2e2','#991b1b');return;}
  if(pw1.length<6){showPwMsg('Password must be at least 6 characters.','#fee2e2','#991b1b');return;}
  if(pw1!==pw2){showPwMsg('Passwords do not match!','#fee2e2','#991b1b');return;}
  btn.disabled=true;btn.textContent='Saving...';
  const {error}=await sb.auth.updateUser({password:pw1});
  btn.disabled=false;btn.textContent='Save New Password';
  if(error){showPwMsg('❌ '+error.message,'#fee2e2','#991b1b');}
  else{showPwMsg('✅ Password changed successfully!','#dcfce7','#166534');setTimeout(()=>closeChangePw(),2000);}
}
function showPwMsg(txt,bg,color){
  const el=document.getElementById('changePwMsg');
  el.textContent=txt;el.style.background=bg;el.style.color=color;el.style.display='block';
}

function openSkMod(lvl){curSkLvl=lvl;document.getElementById('newsk').value='';document.getElementById('skillMod').classList.add('on');}
function closeSkMod(){document.getElementById('skillMod').classList.remove('on');curSkLvl=null;}
function addSkill(){
  const name=document.getElementById('newsk').value.trim();
  if(!name){alert('Please enter skill name!');return;}
  D[curSkLvl].skills.push(name);
  closeSkMod();
  const al=document.querySelector('.lsec.active')?.id?.replace('sec-','');
  render();if(al)showLvl(al,document.querySelector('.tab.active'));
  restoreF();saveAll();
}
function removeSkill(lvl,si){
  if(!confirm(`Remove "${D[lvl].skills[si]}"?`))return;
  D[lvl].skills.splice(si,1);
  const al=document.querySelector('.lsec.active')?.id?.replace('sec-','');
  render();if(al)showLvl(al,document.querySelector('.tab.active'));
  restoreF();saveAll();
}

// ── STUDENT ──
function addStudent(lvl){
  const name=prompt(`Student name for ${lvl}:`);
  if(!name?.trim())return;
  D[lvl].students.push(name.trim());
  const cont=document.getElementById(`stu-${lvl}`);
  const empty=document.getElementById(`emp-${lvl}`);
  if(empty)empty.remove();
  const idx='x'+Date.now();
  const ci=D[lvl].students.length-1;
  const div=document.createElement('div');
  div.innerHTML=buildStudent(lvl,name.trim(),idx,ci);
  cont.appendChild(div.firstElementChild);
  updCount(lvl);saveAll();
}

function showConfirm(lvl,idx){
  document.getElementById(`conf-${lvl}-${idx}`).classList.add('on');
}
function hideConfirm(lvl,idx){
  document.getElementById(`conf-${lvl}-${idx}`).classList.remove('on');
}
function removeStudent(lvl,idx){
  const name=D[lvl].students[typeof idx==='number'?idx:D[lvl].students.findIndex((_,i)=>String(i)===String(idx)||`x${i}`===String(idx))];
  // find by row element
  const row=document.getElementById(`srow-${lvl}-${idx}`);
  const nameEl=row?.querySelector('.sname');
  const actualName=nameEl?nameEl.textContent:null;
  if(actualName){
    const pos=D[lvl].students.indexOf(actualName);
    if(pos>-1)D[lvl].students.splice(pos,1);
  }
  if(row)row.remove();
  if(D[lvl].students.length===0){
    const cont=document.getElementById(`stu-${lvl}`);
    if(cont)cont.innerHTML=`<div id="emp-${lvl}" style="padding:24px;color:#888;text-align:center;">No students yet. Click "+ Add Student" below.</div>`;
  }
  updCount(lvl);saveAll();
}

function updCount(lvl){
  const el=document.querySelector(`#sec-${lvl} .lhdr p`);
  if(el)el.textContent=`${D[lvl].sub} · ${D[lvl].students.length} student(s)`;
}

// ── BUILD ──
function buildStudent(lvl,name,idx,ci){
  const skills=D[lvl].skills;
  const c=col(ci);
  const nid=`tn__${lvl}__${idx}`;

  const rows=skills.map((s,si)=>`
    <tr>
      <td style="width:18%;">
        <span class="skill-name">${s}</span>
        <span class="skill-tr no-print" data-l="${lvl}" data-i="${si}"></span>
        <button class="btn-delskill no-print" onclick="removeSkill('${lvl}',${si})">✕ remove</button>
      </td>
      ${WEEKS.map((_,wi)=>`<td style="text-align:center;">${mkScore(`${lvl}__${idx}__w${wi+1}__${si}`)}</td>`).join('')}
      <td style="width:16%;">
        <textarea class="notea" data-save="note__${lvl}__${idx}__${si}" oninput="qSave()" placeholder="Observation..."></textarea>
        <button class="aibtn no-print" onclick="fixGrammar(this)">✨ Fix Grammar</button>
      </td>
    </tr>`).join('');

  return`
  <div class="srow" id="srow-${lvl}-${idx}">
    <div class="shdr" style="border-left-color:${c};background:${c}10;">
      <div class="savatar" style="background:${c};">${ini(name)}</div>
      <div><div class="sname" style="color:${c};">${name}</div><div class="ssub">Student</div></div>
      <button class="btn-rem no-print" onclick="showConfirm('${lvl}','${idx}')">✕ Remove</button>
    </div>
    <div class="confbox no-print" id="conf-${lvl}-${idx}">
      <span>Remove <b>${name}</b>?</span>
      <button class="tbtn" style="background:#e74c3c;color:white;padding:4px 12px;font-size:11px;" onclick="removeStudent('${lvl}','${idx}')">Yes, Remove</button>
      <button class="tbtn" style="background:#aaa;color:white;padding:4px 12px;font-size:11px;" onclick="hideConfirm('${lvl}','${idx}')">Cancel</button>
    </div>
    <div style="overflow-x:auto;">
      <table class="stbl" style="min-width:${560+WEEKS.length*58}px;">
        <thead><tr>
          <th style="text-align:left;width:18%;">Skill Area</th>
          ${WEEKS.map(w=>`<th>${w}</th>`).join('')}
          <th style="width:16%;">Comments</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="tnotes">
      <div class="tnotes-lbl" style="color:${c};">📝 Teacher's Notes & Focus Areas</div>
      <textarea class="tnotes-area" data-save="${nid}" oninput="qSave()" rows="3" style="border-color:${c}80;" placeholder="Write notes for this student..."></textarea>
      <div class="tnotes-actions no-print">
        <button class="fixbtn" onclick="fixNoteGrammar(this,'${nid}')">✨ Fix Grammar</button>
      </div>
      <div id="trb-${nid}"></div>
    </div>
  </div>`;
}

function buildLevel(lvl){
  const info=D[lvl];
  const blocks=info.students.length
    ?info.students.map((s,i)=>buildStudent(lvl,s,i,i)).join('')
    :`<div id="emp-${lvl}" style="padding:24px;color:#888;text-align:center;">No students yet. Click "+ Add Student" below.</div>`;

  const lgItems=SCORES.map(s=>`
    <div class="legend-item">
      <span style="font-weight:700;color:#1a3a5c;">${s.min===s.max?s.min:s.min+'–'+s.max}</span>
      <span style="color:#444;"> — ${s.en}</span>
      <div class="legend-tr no-print" data-k="${s.en}"></div>
    </div>`).join('');

  return`
  <div class="lsec ${lvl==='A1'?'active':''}" id="sec-${lvl}">
    <div class="lhdr">
      <h2>${info.label}</h2>
      <p>${info.sub} · ${info.students.length} student(s)</p>
    </div>
    <div class="card">
      <div class="legend no-print">
        <div class="legend-title">📊 Score Guide</div>
        <div class="legend-grid">${lgItems}</div>
      </div>
      <div id="stu-${lvl}">${blocks}</div>
      <div class="cardfooter no-print">
        <button class="btn-addst" onclick="addStudent('${lvl}')">+ Add Student</button>
        <button class="btn-addsk" onclick="openSkMod('${lvl}')">+ Add Skill Area</button>
      </div>
    </div>
  </div>`;
}

function render(){document.getElementById('mc').innerHTML=Object.keys(D).map(buildLevel).join('');}
function showLvl(lvl,btn){
  document.querySelectorAll('.lsec').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('sec-'+lvl)?.classList.add('active');
  if(btn)btn.classList.add('active');
}

initD();
sb.auth.getSession().then(({data:{session}})=>{if(session?.user)startApp(session.user);});
</script>
